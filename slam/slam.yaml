# slam_toolbox para el karting (coche 1:10, LiDAR de 120 rayos y 4 m)
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_slam         # /scan reordenado de -pi a pi (scan_slam.py)
    resolution: 0.025              # 2,5 cm por celda (la pista mide 80 cm de ancho)
    max_laser_range: 4.0
    minimum_time_interval: 0.0
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.15
    map_update_interval: 1.0
    transform_publish_period: 0.05
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    throttle_scans: 1
    stack_size_to_use: 40000000
    do_loop_closing: true          # estricto: con los valores normales une tramos que no son el mismo
    loop_search_maximum_distance: 2.0
    loop_match_minimum_chain_size: 15
    loop_match_minimum_response_coarse: 0.5
    loop_match_minimum_response_fine: 0.6
    correlation_search_space_dimension: 0.2
    correlation_search_space_resolution: 0.005
    correlation_search_space_smear_deviation: 0.02
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    use_scan_matching: true
    use_scan_barycenter: true
    angle_variance_penalty: 2.0
    distance_variance_penalty: 2.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.9
    use_response_expansion: true
    debug_logging: false
    enable_interactive_mode: false
